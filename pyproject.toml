[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robodog"
version = "0.1.0"
description = "Nauka chodzenia robopsa metodą uczenia przez wzmacnianie (praca magisterska)"
readme = "README.md"
requires-python = ">=3.12"

# Celowo pusto. Zależności (torch, mujoco, ...) są w environment.yml, bo pin
# torcha wymaga dodatkowego indeksu CUDA, którego pyproject.toml nie potrafi
# przenośnie wyrazić. Trzymanie ich w dwóch miejscach skończyłoby się rozjazdem.
dependencies = []

# Rejestracja zadań RoboDoga w mjlab: mjlab przy imporcie ładuje pakiety z tej
# grupy entry-pointów i uruchamia ich rejestrację (register_mjlab_task).
[project.entry-points."mjlab.tasks"]
robodog = "robodog.tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# mujoco to natywne wiązania C++ — enumy (mjtJoint, mjtObj, ...) i wiele funkcji
# powstają dynamicznie, więc analizator statyczny zgłasza fałszywe
# "is not a known attribute of module". Wyciszamy tę regułę globalnie.
# Uwaga: dotyczy to wszystkich dostępów do atrybutów, więc realna literówka
# w nazwie atrybutu też nie zostanie tu wykryta.
reportAttributeAccessIssue = "none"
